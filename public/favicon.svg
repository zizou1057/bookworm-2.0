    <path d="M18 6 C18 6 26 5 32 8 L32 30 C26 27 18 28 18 28 L18 6Z" fill="white" opacity="0.80"/>
    <!-- Spine -->
    <rect x="17" y="6" width="2" height="22" rx="1" fill="#00847e"/>
    <!-- Lines on left page -->
    <line x1="7" y1="13" x2="15" y2="12" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="7" y1="17" x2="15" y2="16" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="7" y1="21" x2="15" y2="20" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Lines on right page -->
    <line x1="21" y1="12" x2="29" y2="13" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="21" y1="16" x2="29" y2="17" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <line x1="21" y1="20" x2="29" y2="21" stroke="#00BFB3" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>